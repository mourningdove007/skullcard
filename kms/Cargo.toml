[package]
name = "kms"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kms"
path = "main.rs"

[[bin]]
name = "keygen"
path = "bin/keygen.rs"

[dependencies]
axum           = { version = "0.8", features = ["json"] }
serde          = { version = "1",   features = ["derive"] }
serde_json     = "1"
tokio          = { version = "1",   features = ["macros", "rt-multi-thread", "net"] }
rand           = "0.8"
libcrux-ml-dsa = "0.0.9"
base64         = "0.22"
