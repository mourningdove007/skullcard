services:
  kms:
    build: ./kms
    environment:
      API_KEY: ${KMS_API_KEY}
      ML_DSA_SIGNING_KEY: ${ML_DSA_SIGNING_KEY}
      ML_DSA_VERIFICATION_KEY: ${ML_DSA_VERIFICATION_KEY}
    ports:
      - "8081:8080" 

  dealer:
    build: ./dealer
    environment:
      API_KEY: ${API_KEY}
      KMS_URL: http://kms:8080
      KMS_API_KEY: ${KMS_API_KEY}
    ports:
      - "8080:8080"
    depends_on:
      - kms
  
  vault:
  image: hashicorp/vault:latest
  ports: ["8200:8200"]
  environment:
    VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
    VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
  cap_add: [IPC_LOCK]
